<!doctype html>
<html lang="de" data-theme="pond" data-lock="pond">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Koi · Teich</title>
<meta name="description" content="Ein lebendiger ASCII-Koi-Teich für deinen neuen Tab. Mittelklick: eine Katzenpfote greift ins Wasser. Klick: die Koi füttern. Teich, schwarzes und helles Wasser.">
<meta property="og:title" content="ASCII Koi">
<meta property="og:description" content="Ein Koi-Teich aus Textzeichen. Mittelklick: eine Katzenpfote. Klick: die Koi füttern.">
<meta property="og:image" content="https://pursurer.github.io/ascii-koi/media/poster.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0e2a32">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preload" href="../fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/noto-serif-display-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../pond.css">
</head>
<body>
<canvas id="pond" aria-hidden="true"></canvas>
<div class="intro">
  <div class="intro-box" id="intro-box">
    <h1 class="sr" id="sr-title">ASCII Koi</h1>
    <canvas class="wordmark" id="wordmark" aria-hidden="true"></canvas>
    <canvas class="wordmark-tag" id="wordmark-tag" aria-hidden="true"></canvas>
    <p class="intro-line" id="intro-date"></p>
    <p class="intro-fact" id="intro-fact"></p>
  </div>
</div>
<canvas id="snap" aria-hidden="true"></canvas>
<div class="ui" id="ui">
  <div class="themes" role="radiogroup" aria-label="Wasser">
    <button type="button" role="radio" data-theme-pick="pond">teich</button>
    <button type="button" role="radio" data-theme-pick="black">schwarz</button>
    <button type="button" role="radio" data-theme-pick="light">hell</button>
  </div>
  <p class="hint"><span class="mouse"><b>klick</b> füttern</span><span class="mouse"><b>mittelklick</b> katzenpfote</span><span class="touch"><b>tippen</b> katzenpfote</span><span class="touch"><b>halten</b> füttern</span><span class="desk"><b>1 2 3</b> wasser</span><span class="desk"><b>leertaste</b> pause</span><span id="pause-state"></span></p>
  <a id="gh" href="https://github.com/pursurer/ascii-koi" target="_blank" rel="noopener">★ github</a>
</div>
<!-- your own settings, if you made a config.js (see config.example.js); without it the page simply goes on -->
<script src="../config.js"></script>
<script src="../pond.js"></script>
<script src="../app.js"></script>
</body>
</html>
